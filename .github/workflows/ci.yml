name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcups2-dev

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: flake8 src

      - name: Create dummy .env for tests
        # Settings() is instantiated at import time (src/core/config.py),
        # so it needs every required field populated even for tests that
        # never touch config directly. Values are all placeholders — no
        # test hits a real database, mail server, or Telegram/CUPS.
        run: |
          cat > .env <<'EOF'
          PROJECT_NAME=PrintBuddy
          VERSION=0.0.0-test
          ENVIRONMENT=test
          URL=http://localhost
          CORS_ORIGINS=http://localhost:5173
          SECRET_KEY=test-secret-key
          ALGORITHM=HS256
          ACCESS_TOKEN_EXP_MIN=60
          PWD_RESET_SALT=test-salt
          PWD_RESET_URL=http://localhost/password-reset
          PWD_RESET_TIME_MIN=30
          DB_SCHEME=postgresql+psycopg
          DB_HOSTNAME=localhost
          DB_USER=test
          DB_PASSWORD=test
          DB_NAME=test
          MAX_FILE_SIZE_MB=50
          UPLOAD_PATH=/tmp/uploads
          PRINTER_MARKERS_DB=/tmp/printer_markers.db
          TELEGRAM_SECRET=test-telegram-secret
          MAIL_USERNAME=test
          MAIL_PASSWORD=test
          MAIL_FROM=test@example.com
          MAIL_PORT=587
          MAIL_SERVER=localhost
          MAIL_FROM_NAME=PrintBuddy
          EOF

      - name: Test
        run: pytest -v

  e2e:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Every docker compose invocation in this job re-validates the whole
      # compose file (image refs included), even when a step only touches
      # one service (e.g. seed.py's `exec postgres` calls, or the final
      # teardown) — so these need to be job-scoped, not just set on the
      # "Start the E2E stack" step.
      BACKEND_IMAGE: local-backend:e2e
      FRONTEND_IMAGE: local-frontend:e2e
    steps:
      - uses: actions/checkout@v4
        with:
          path: backend

      - name: Checkout print-buddy-infra (E2E stack + Playwright suite)
        uses: actions/checkout@v4
        with:
          repository: PrintBuddy/print-buddy-infra
          path: infra

      - name: Checkout frontend (built fresh below — see infra/e2e/README.md)
        uses: actions/checkout@v4
        with:
          repository: PrintBuddy/print-buddy-frontend
          path: frontend-src

      - name: Build backend image (this PR's code)
        run: docker build -t local-backend:e2e ./backend

      - name: Build frontend image for the E2E stack
        # VITE_API_BASE_URL is baked in at build time — must point at the
        # backend's host-published port, since Playwright's browser runs
        # on this runner, not inside the compose network (see
        # infra/e2e/README.md).
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=http://localhost:8000/api \
            -t local-frontend:e2e \
            ./frontend-src/app

      - name: Start the E2E stack
        working-directory: infra/e2e
        run: |
          docker compose -f docker-compose.e2e.yml up -d --build

      - name: Wait for backend health
        # docker-entrypoint.sh already runs `alembic upgrade head` before
        # starting uvicorn, so a healthy response means migrations are
        # applied too — no separate migration step needed here.
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health >/dev/null; then
              echo "Backend is healthy."
              exit 0
            fi
            sleep 3
          done
          echo "Backend never became healthy." >&2
          exit 1

      - name: Seed test users, admin, and printer pricing
        working-directory: infra/e2e
        run: python3 seed.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        working-directory: infra/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: infra/e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: infra/e2e/playwright-report/
          retention-days: 7

      - name: Tear down the E2E stack
        if: always()
        working-directory: infra/e2e
        run: docker compose -f docker-compose.e2e.yml down -v

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/printbuddy/print-buddy-backend:latest
            ghcr.io/printbuddy/print-buddy-backend:${{ github.sha }}
